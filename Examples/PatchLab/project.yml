name: PatchLab
options:
  deploymentTarget:
    iOS: "15.0"
packages:
  BugCapsulePatch:
    path: ../../Packages/BugCapsulePatch
targets:
  PatchLab:
    type: application
    platform: iOS
    sources: [PatchLab]
    dependencies:
      - package: BugCapsulePatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bugcapsule.patchlab.ios
        PRODUCT_NAME: PatchLab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Patch Lab
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
