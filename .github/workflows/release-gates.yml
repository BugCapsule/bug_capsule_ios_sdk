name: Release gates
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test-patch-runtime-package.py
      - run: swift test
      - run: swift test -c release -Xswiftc -enable-testing --filter ReplayProtocolTests/testGate
      - run: sh scripts/package-release.sh
      - run: python3 scripts/test-release-consumer.py dist/bugcapsule-ios-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: spm-source-candidate
          path: dist/*
  # swift test runs on the macOS host only; iOS-only behaviour (MetricKit,
  # data protection, the simulator's image list) needs an iOS runtime.
  ios-simulator:
    name: ios-simulator
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Pick an iPhone simulator
        id: sim
        run: python3 scripts/pick-ios-simulator.py >> "$GITHUB_OUTPUT"
      # A hung test fails on its own after 5 minutes (xcodebuild test
      # timeouts) and a hung step after 40, with time left for the logs,
      # instead of the job being cancelled at the 60-minute limit.
      - name: BugCapsule-Package on the iOS Simulator
        timeout-minutes: 40
        run: >-
          xcodebuild -scheme BugCapsule-Package -destination "id=${{ steps.sim.outputs.udid }}"
          -derivedDataPath "$RUNNER_TEMP/dd"
          -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 300
          -skip-testing:BugCapsulePatchTests
          test
  # The patch tests, from the root package, on their own runner: a patch
  # build problem never hides or blocks the SDK tests' result. (The
  # Packages/BugCapsulePatch wrapper declares a product with the root
  # product's name; Xcode 26 cannot load both in one graph.)
  ios-simulator-patch:
    name: ios-simulator-patch
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Pick an iPhone simulator
        id: sim
        run: python3 scripts/pick-ios-simulator.py >> "$GITHUB_OUTPUT"
      - name: BugCapsulePatchTests on the iOS Simulator
        timeout-minutes: 30
        run: >-
          xcodebuild -scheme BugCapsule-Package -destination "id=${{ steps.sim.outputs.udid }}"
          -derivedDataPath "$RUNNER_TEMP/dd-patch"
          -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 300
          -only-testing:BugCapsulePatchTests
          test
