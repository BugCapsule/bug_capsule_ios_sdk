name: Release gates
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test-patch-runtime-package.py
      - run: swift test
      - run: swift test -c release -Xswiftc -enable-testing --filter ReplayProtocolTests/testGate
      - run: sh scripts/package-release.sh
      - run: python3 scripts/test-release-consumer.py dist/bugcapsule-ios-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: spm-source-candidate
          path: dist/*
  # swift test runs on the macOS host only; iOS-only behaviour (MetricKit,
  # data protection, the simulator's image list) needs an iOS runtime.
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in devices if "SimRuntime.iOS" in r), key=lambda r: [int(p) for p in r.rsplit("iOS-", 1)[1].split("-")])
          phones = [d["udid"] for r in reversed(ios) for d in devices[r] if d["name"].startswith("iPhone")]
          print(phones[0])')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: BugCapsule-Package on the iOS Simulator
        run: xcodebuild -scheme BugCapsule-Package -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath "$RUNNER_TEMP/dd" test
      - name: BugCapsulePatchLocal on the iOS Simulator
        working-directory: Packages/BugCapsulePatch
        run: xcodebuild -scheme BugCapsulePatchLocal -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath "$RUNNER_TEMP/dd-patch" test
